name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir buildsrc
          unzip -q Wijaya_Digital_Printing_Android.zip -d buildsrc

            - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildsrc/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "    defaultConfig {",
              """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              defaultConfig {"""
          )

          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p buildsrc assembleDebug
