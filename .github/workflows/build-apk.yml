name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir buildsrc
          unzip -q Wijaya_Digital_Printing_Android.zip -d buildsrc

      - name: Build APK
        run: gradle -p buildsrc assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wijaya-Digital-Printing-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
