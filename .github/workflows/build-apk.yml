name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir buildsrc
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d buildsrc

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildsrc/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "    defaultConfig {",
              """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              defaultConfig {"""
          )

          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p buildsrc assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wijaya-Digital-Printing-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
